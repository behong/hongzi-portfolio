# To enable, copy this file to .github/workflows/validate.yml.
name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test automatic sync
        run: python3 -m unittest discover -s checks -p 'test_*.py'
      - name: Validate Compose and Caddy
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start web server
        run: docker compose -f docker-compose.yml -f docker-compose.preview.yml up -d --wait --wait-timeout 90 web
      - name: Check pages and redirect
        shell: bash
        run: |
          set -euo pipefail
          for path in / /seedance.html /fpv.html; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:18080${path}"
          done
          headers=$(curl --silent --show-error --dump-header - --output /dev/null -H 'Host: www.hongzi.us' 'http://127.0.0.1:18080/fpv.html?from=www' | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -E '^HTTP/[0-9.]+ 301 '
          echo "$headers" | grep -Fx 'Location: https://hongzi.us/fpv.html?from=www'
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose logs --tail=100 web
          docker compose down
